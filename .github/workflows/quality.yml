name: Quality

on:
  pull_request:
    branches:
      - master
  push:
    branches:
      - master

permissions:
  contents: read

concurrency:
  group: quality-${{ github.workflow }}-${{ github.ref }}
  cancel-in-progress: true

jobs:
  quality:
    name: Format, lint, test and build
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v7
        with:
          # The quality tool compares the branch with master.
          fetch-depth: 0

      - name: Setup .NET
        uses: actions/setup-dotnet@v6
        with:
          dotnet-version: 10.0.x

      - name: Setup pnpm
        uses: pnpm/action-setup@v6
        with:
          version: 10.17.1

      - name: Setup Node.js
        uses: actions/setup-node@v7
        with:
          node-version: 24
          cache: pnpm
          cache-dependency-path: src/web/pnpm-lock.yaml

      - name: Install web dependencies
        run: pnpm --dir src/web install --frozen-lockfile

      - name: Install Playwright browser
        run: pnpm --dir src/web exec playwright install --with-deps chromium

      - name: Prepare CI environment
        run: cp .env.example .env

      - name: Start infrastructure
        run: make docker-up

      - name: Quality rules
        run: dotnet run --project tools/quality/Coordina.Quality/Coordina.Quality.csproj --configuration Release -- check --all --format github

      - name: Affected suites
        if: github.event_name == 'pull_request'
        env:
          BASE_REF: origin/${{ github.base_ref }}
        run: |
          {
            echo '### Suites this change affects'
            echo '```text'
            dotnet run --project tools/quality/Coordina.Quality/Coordina.Quality.csproj --configuration Release --no-build -- affected --base "$BASE_REF"
            echo '```'
            echo 'Every suite still runs for now. Running only these is the next step of the CI plan.'
          } >> "$GITHUB_STEP_SUMMARY"

      - name: Run quality gate
        run: make quality

      - name: Stop infrastructure
        if: always()
        run: make docker-down
