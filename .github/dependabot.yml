version: 2

updates:
  - package-ecosystem: nuget
    directory: /
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["type: dependencies", "area: api"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      nuget-minor-and-patch:
        update-types: [minor, patch]
    ignore:
      # tools/analyzers runs inside the compiler, so it must not reference a
      # Roslyn newer than the oldest SDK that builds the API (Roslyn 5.0 ships
      # with SDK 10.0.1xx). CI installs the newest SDK and would not notice.
      # Raise it by hand, with the SDK floor; the quality tool, which only uses
      # Roslyn as a library, follows on the same occasion.
      - dependency-name: Microsoft.CodeAnalysis.CSharp
        update-types: ["version-update:semver-major"]
      - dependency-name: Microsoft.CodeAnalysis.Analyzers
        update-types: ["version-update:semver-major"]

  - package-ecosystem: npm
    directory: /src/web
    schedule:
      interval: weekly
      day: monday
    open-pull-requests-limit: 5
    labels: ["type: dependencies", "area: web"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      web-minor-and-patch:
        update-types: [minor, patch]

  - package-ecosystem: github-actions
    directory: /
    schedule:
      interval: weekly
      day: monday
    labels: ["type: dependencies", "area: infra"]
    commit-message:
      prefix: chore
      include: scope
    groups:
      actions:
        patterns: ["*"]

  - package-ecosystem: docker
    directory: /docker
    schedule:
      interval: weekly
      day: monday
    labels: ["type: dependencies", "area: infra"]
    commit-message:
      prefix: chore
      include: scope
