# PostgreSQL for the automated tests: make docker-test-up. It is a project of
# its own, so starting, stopping or wiping it never touches development data.
# The server is disposable: its files live in memory and it skips the writes
# that protect data from a crash, which also makes it faster than db.
name: coordina-test

services:
  db-test:
    image: postgres:16
    container_name: coordina-db-test
    environment:
      POSTGRES_USER: coordina_test
      POSTGRES_PASSWORD: coordina_test
      POSTGRES_DB: coordina_test
    ports:
      - "127.0.0.1:${POSTGRES_TEST_PORT:-5433}:5432"
    tmpfs:
      - /var/lib/postgresql/data:size=2g
    # Test classes run in parallel, each with its own database and pool.
    command:
      - postgres
      - -c
      - fsync=off
      - -c
      - synchronous_commit=off
      - -c
      - full_page_writes=off
      - -c
      - max_connections=500
    healthcheck:
      test: ["CMD-SHELL", "pg_isready --username=$$POSTGRES_USER --dbname=$$POSTGRES_DB --host=127.0.0.1"]
      interval: 1s
      timeout: 3s
      retries: 60
